<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
* {
    margin: 0;
    padding: 0;
    /* box-sizing: border-box; */
    font-family: Arial, Helvetica, sans-serif;
}

/* .header {
    background-color: black;
} */

#logo_image {
    width: 60px;
    height: 60px;
}

.navigation {
    height: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    background-color: aliceblue;
}

.navigators {
    display: flex;
    gap: 20px;
    list-style: none;
}

.navigators a {
    text-decoration: none;
    color: rgba(255, 204, 0, 0.762);
    text-transform: uppercase;
    font-weight: bold;
}

</style>
</head>
<body>
    <div id="root">
        <header class="header">
            <nav class="navigation">
                <div class="logo">
                    <img src="./image/logo.avif" alt="" id="logo_image">
                </div>

                <ul class="navigators">
                    <li class="item"><a href="">Trang Trủ</a></li>
                    <li class="item"><a href="">Báo Giá</a></li>
                    <li class="item"><a href="">Mẫu thiết kế</a></li>
                    <li class="item"><a href="">Sản phẩm</a></li>
                    <li class="item"><a href="">Tin Tức</a></li>
                    <li class="item"><a href="">Liên hệ</a></li>
                </ul>
            </nav>

            <div class="banner">
                <img src="./image/logo.avif" alt="banner">
                <div class="mail">example@gmail.com</div>
                <div class="phone">0987654321</div>
            </div>
        </header>

        <div class="container">

        </div>

        <footer class="footer">

        </footer>
    </div>
</body>
</html>
